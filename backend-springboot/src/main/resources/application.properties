spring.application.name=boutique-os-backend
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/boutique-os}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
app.seed-demo-data=${APP_SEED_DEMO_DATA:false}
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.price-id=${STRIPE_PRICE_ID:}
app.stripe.price-basic=${STRIPE_PRICE_BASIC:}
app.stripe.price-pro=${STRIPE_PRICE_PRO:}
# Precios anuales (10 meses: 2 gratis)
app.stripe.price-basic-annual=${STRIPE_PRICE_BASIC_ANNUAL:}
app.stripe.price-pro-annual=${STRIPE_PRICE_PRO_ANNUAL:}
app.stripe.checkout.mode=${STRIPE_CHECKOUT_MODE:subscription}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}
app.mail.from=${APP_MAIL_FROM:}

# SMTP: obligatorio en produccion. Sin esto no llegan los correos de activacion ni
# los codigos de verificacion en dos pasos (entrar, recuperar y cambiar la
# contrasena). Como respaldo, el codigo queda escrito en el log.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.ttl-hours=${APP_JWT_TTL_HOURS:12}
# En produccion va en true: sin APP_JWT_SECRET el servidor no arranca, en lugar de
# generar una clave al azar y cerrar todas las sesiones en cada reinicio.
app.jwt.require-secret=${APP_JWT_REQUIRE_SECRET:false}
app.admin.secret=${APP_ADMIN_SECRET:}

# Dia de la tienda para cortes y reportes (el servidor corre en UTC).
app.business-zone=${APP_BUSINESS_ZONE:America/Mexico_City}
