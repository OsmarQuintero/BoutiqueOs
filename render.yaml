services:
  - type: web
    name: boutique-os-backend
    plan: free
    dockerfilePath: backend-springboot/Dockerfile
    dockerContext: backend-springboot
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_H2_CONSOLE_ENABLED
        value: "false"
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      # Sin esta clave cada reinicio cerraba todas las sesiones. Render la genera.
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_JWT_REQUIRE_SECRET
        value: "true"
      - key: APP_ADMIN_SECRET
        generateValue: true
      - key: APP_FRONTEND_URL
        sync: false
      # Correo: obligatorio. Sin SMTP no llegan los codigos de verificacion.
      - key: APP_MAIL_FROM
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_BASIC
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
