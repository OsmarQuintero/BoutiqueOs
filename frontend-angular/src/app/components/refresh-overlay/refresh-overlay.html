@if (refresh.isActive()) {
  <div class="refresh-overlay" aria-live="polite" aria-busy="true">
    <div class="refresh-panel">
      <div class="refresh-spinner"></div>
      <div>
        <strong>{{ refresh.message() }}</strong>
        <span>{{ store.t('refresh.moment') }}</span>
      </div>
    </div>
  </div>
}
